const state={memberResults:[],me:null,view:'home',profile:null,profileLogs:[],profileSort:'recent',feed:[],feedMode:"global",notifications:[],unreadNotifications:0,members:[],type:'anime',results:[],featured:[],search:'',loading:false,comments:{},commentOpen:{},logTarget:null,returnProfile:false,forumMode:'forum',dmThreads:[],activeDm:null};

const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=t=>{const d=new Date(Number(t)||Date.now());return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};const timeAgo=t=>{const m=Math.max(0,Math.floor((Date.now()-Number(t))/60000));return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`};const initials=s=>String(s||'?').slice(0,1).toUpperCase();const coverImg=(url,alt='')=>url?`<img class="cover" src="${esc(url)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"> <div class="cover-empty" style="display:none">${ico('spark')}</div>`:`<div class="cover-empty">${ico('spark')}</div>`;

function activityCoverFailed(img){
 if(img.dataset.artworkTitle){const key=artworkKey(img.dataset.artworkTitle,img.dataset.mediaType);verifiedArtworkMemory.delete(key);try{localStorage.removeItem(VERIFIED_ARTWORK_PREFIX+key)}catch{}}
 // Existing URLs can be stale. Turn them into recoverable titles instead of
 // replacing them with a permanent spark icon.
 const replacement=document.createElement('div');
 replacement.className='activity-cover activity-cover-missing';replacement.setAttribute('role','button');replacement.tabIndex=0;
 replacement.dataset.filmTitle=img.dataset.artworkTitle||img.alt||'';
 replacement.dataset.mediaType=img.dataset.mediaType||'anime';
 replacement.dataset.rejectedArtwork=img.dataset.coverOriginal||img.currentSrc||img.src;
 replacement.style.cssText='display:grid;place-items:center;font-size:24px';
 replacement.innerHTML=TYPES[replacement.dataset.mediaType]?.icon||ico('spark');
 img.replaceWith(replacement);void hydrateActivityCover(replacement);
}
async function hydrateActivityCover(node){
 if(!node?.isConnected||node.dataset.loadingArtwork==='1')return;
 node.dataset.loadingArtwork='1';
 const title=node.dataset.filmTitle,type=node.dataset.mediaType||'anime';
 try{
  let source=await sharedCoverForTitle(title,type);
  let src=source?await testedImage(source):'';
  if(!src&&node.dataset.rejectedArtwork){
   // The feed may contain an expired/invalid cover URL from a user's old log.
   // Request fresh provider alternatives, not the same broken image forever.
   const fresh=await cachedCoverDetails(title,type,true).catch(()=>({cover:'',alternates:[]}));
   for(const next of [fresh.cover,...(fresh.alternates||[])]){
    if(!next||next===source||next===node.dataset.rejectedArtwork)continue;
    const tried=await testedImage(next);if(tried){source=next;src=tried;break;}
   }
  }
  if(!src||!node.isConnected)return;
  saveVerifiedArtwork(title,type,source);
  const img=document.createElement('img');img.className='activity-cover';img.alt=title;img.setAttribute('role','button');img.tabIndex=0;
  img.loading='lazy';img.decoding='async';
  img.dataset.artworkTitle=title;img.dataset.mediaType=type;img.dataset.coverOriginal=source;
  img.onload=()=>recordCoverLoaded(img);img.onerror=()=>activityCoverFailed(img);
  node.replaceWith(img);img.src=src;
 }catch{}finally{node.dataset.loadingArtwork='0'}
}
async function loadRecentFilmCovers(scope=document){
 // Despite its old name this now covers every medium and every rendered feed,
 // including the right-hand Global Recents panel on the homepage.
 const nodes=[...scope.querySelectorAll('.activity-cover-missing[data-film-title]')].slice(0,state.view==='home'?14:36);let next=0;
 const worker=async()=>{while(next<nodes.length){await hydrateActivityCover(nodes[next++]);}};
 await Promise.all(Array.from({length:Math.min(10,nodes.length)},worker));

// Profile-specific avatar loader: preserve uploaded PFPs and retry the linked account image.
function profileAvatarFailed(img){
  const fallback=img.getAttribute('data-fallback-src')||'';
  if(fallback && img.getAttribute('data-attempted-fallback')!=='yes'){
    img.setAttribute('data-attempted-fallback','yes');
    img.src=fallback;
    return;
  }
  const span=document.createElement('span');
  span.className=img.className;
  span.textContent=img.getAttribute('data-initials')||'?';
  span.setAttribute('role','img');
  span.setAttribute('aria-label',img.alt||'Profile picture');
  span.style.width=img.style.width;
  span.style.height=img.style.height;
  img.replaceWith(span);
}
function profileAvatar(u,size=88,klass='pf-hero-avatar'){
  const primary=String(u?.avatarUrl||u?.avatar_url||'').trim();
  const backup=String(u?.avc||u?.avatar||'').trim();
  const valid=v=>/^https?:\/\//i.test(v)||/^\/(?!\/)/.test(v)||/^data:image\/(png|jpeg|webp|gif|avif);base64,[A-Za-z0-9+/=]+$/i.test(v);
  const first=valid(primary)?primary:valid(backup)?backup:'';
  const second=valid(backup)&&backup!==first?backup:'';
  const name=String(u?.globalName||u?.name||'Profile');
  const classes='avatar '+klass;
  const fallback=esc(initials(name));
  if(!first)return `<span class="${classes}" role="img" aria-label="${esc(name)} profile picture" style="width:${size}px;height:${size}px">${fallback}</span>`;
  return `<img class="${classes}" src="${esc(first)}" ${second?`data-fallback-src="${esc(second)}"`:''} data-initials="${fallback}" alt="${esc(name)} profile picture" style="width:${size}px;height:${size}px" loading="eager" decoding="async" onerror="profileAvatarFailed(this)">`;
}

async function loadMediaCredits(r,type){
  const peopleRoot=$('#mdPeople'),creditRoot=$('#mdCredits');
  if(!peopleRoot||!creditRoot)return;
  // Guard against stale results from a modal that was closed/replaced mid-fetch.
  const active=()=>peopleRoot.isConnected && creditRoot.isConnected && $('#mdPeople')===peopleRoot;
  const quick=detailCreditMarkup(r,type);
  const params=new URLSearchParams({type,title:r.title||'',key:r.key||'',year:String(r.year||'').slice(0,4)});
  const cacheKey=params.toString();
  const show=(data)=>{
    if(!active()||!data)return;
    const sections=[];const add=(label,values)=>{const list=[...new Set((values||[]).map(x=>String(x||'').trim()).filter(Boolean))];if(list.length)sections.push(`<div class="md-credit"><b>${esc(label)}</b><span>${list.map(esc).join(', ')}</span></div>`)};
    add('Director',data.directors);add('Created by',data.creators);add('Author / Artist',data.authors);add('Studio',data.studios);
    // Search-provided credits stay visible if an external source has less information.
    creditRoot.innerHTML=[quick,...sections].filter(Boolean).join('')||'<div class="md-muted">No verified credits available for this title yet.</div>';
    const crew=(data.crew||[]).filter(x=>x?.name);const cast=(data.cast||[]).filter(x=>x?.name);const voices=(data.voices||[]).filter(x=>x?.name);
    peopleRoot.innerHTML=(crew.length?peopleMarkup(crew,['anime','manga'].includes(type)?'Creators & staff':'Directors & crew'):'')+(cast.length?peopleMarkup(cast,['anime','manga'].includes(type)?'Characters':'Cast'):'')+(voices.length?peopleMarkup(voices,'Voice actors'):'');
  };
  if(mediaCreditsCacheV53.has(cacheKey)){show(mediaCreditsCacheV53.get(cacheKey));return}
  // All confirmed author information is already on screen; don't block the modal.
  const shouldEnrich=['anime','manga','film','tv','novel','light-novel','webnovel','comic'].includes(type);
  if(!shouldEnrich){if(!quick)creditRoot.innerHTML='<div class="md-muted">No verified credits available for this title yet.</div>';return}
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),2800);
  try{
    const response=await fetch('/api/credits/v53?'+params,{signal:controller.signal,headers:{Accept:'application/json'}});
    if(!response.ok)throw new Error('Credits unavailable');
    const data=await response.json();mediaCreditsCacheV53.set(cacheKey,data);

function profileCoverFailed(img,type,title){
 type=type||img.dataset.mediaType;title=title||img.dataset.title;
 const original=img.dataset.coverOriginal||'';
 if(!img.dataset.triedDirect&&/^https:\/\//.test(original)){
  img.dataset.triedDirect='1';img.src=catalogCoverProxy(original);return;
 }
 if(!img.dataset.triedV42&&/^https:\/\//.test(original)){
  img.dataset.triedV42='1';img.src=catalogCoverProxy(original,true);return;
 }
 if(!img.dataset.triedAlternate&&TYPES[type]&&type!=='all'){
  img.dataset.triedAlternate='1';
  void cachedCoverDetails(title,type,true).then(data=>{
   if(!img.isConnected)return;
   const other=[data.cover,...(data.alternates||[])].find(x=>x&&x!==original);
   if(other){img.dataset.coverOriginal=other;img.dataset.triedDirect='';img.src=catalogCoverSrc(other);}
   else displayMissingProfileCover(img,type,title);
  }).catch(()=>displayMissingProfileCover(img,type,title));return;
 }
 displayMissingProfileCover(img,type,title);
}
function displayMissingProfileCover(img,type,title){

 const d=document.createElement('div');d.className='pf-img pf-empty';d.innerHTML=TYPES[type]?.icon||ico('spark');

}

const mtProfileLayout=u=>MT_PROFILE_LAYOUTS.includes(u?.socials?.profileLayout)?u.socials.profileLayout:'original';
const mtSkinOwn=()=>!!(state.me&&state.profile&&String(state.me.id)===String(state.profile.id));
const mtSkinOrdered=logs=>(logs||[]).slice().sort((a,b)=>(Number(b.updatedAt)||0)-(Number(a.updatedAt)||0));
function mtSkinFavorites(u,all){
 const favorites=parseFavs(u),wanted=new Set(favorites);
 const chosen=all.filter(l=>wanted.has(String(l.mediaKey))&&!isPlanning(l));
 const seen=new Set();
 return (chosen.length?chosen:all.filter(l=>!isPlanning(l)&&rnum(l)!==null).sort((a,b)=>rnum(b)-rnum(a))).filter(l=>{const k=String(l.mediaType)+'/'+String(l.title).toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,5);
}
function mtSkinButtons(u){
 if(mtSkinOwn())return `<button type="button" class="mt-skin-action" onclick="openProfileEditor()">${ico('edit')} Edit profile</button><button type="button" class="mt-skin-action" onclick="mtSkinShare()">${ico('share')} Share</button>`;
 return `<button type="button" class="mt-skin-action mt-skin-action-main" onclick="toggleFollow('${esc(u.name)}',${!!u.isFollowing})">${u.isFollowing?ico('check')+' Following':ico('plus')+' Follow'}</button><button type="button" class="mt-skin-action" onclick="startDm('${esc(u.name)}')">${ico('chat')} Message</button><button type="button" class="mt-skin-action" onclick="mtSkinShare()">${ico('share')} Share</button>`;
}
function mtSkinShare(){const link=location.href;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>toast('Profile link copied.','success')).catch(()=>toast('Copy the profile URL from the address bar.'));}else toast('Copy the profile URL from the address bar.')}
function mtSkinHeader(u,style){
 return `<header class="mt-skin-hero"><div class="mt-skin-cover" style="${bannerStyle(u)}"></div><div class="mt-skin-identity">${profileAvatar(u,98,'mt-skin-avatar')}<div class="mt-skin-person"><h1>${esc(u.globalName||u.name)}</h1><span class="mt-skin-handle">@${esc(u.name)}</span>${u.status?`<p class="mt-skin-status">${esc(u.status)}</p>`:''}</div><div class="mt-skin-actions">${mtSkinButtons(u)}</div></div>${u.bio?`<p class="mt-skin-bio">${esc(u.bio)}</p>`:''}</header>`;
}
function mtSkinTabNav(tabs,active){return `<nav class="mt-skin-tabs" aria-label="Profile layout navigation">${tabs.map(([id,label])=>`<button type="button" class="mt-skin-tab ${active===id?'active':''}" onclick="setProfileTab('${id}')">${esc(label)}</button>`).join('')}</nav>`}
function mtSkinGrid(logs,empty='No titles added yet.'){return logs.length?`<div class="mt-skin-postergrid">${logs.map(l=>pfPoster(l)).join('')}</div>`:`<p class="mt-skin-empty">${esc(empty)}</p>`}
function mtSkinGroup(title,body,extra=''){return `<section class="mt-skin-group"><header class="mt-skin-group-head"><h2>${esc(title)}</h2>${extra}</header>${body}</section>`}
function mtSkinStats(u,all,onlyAnime=false){
 const logs=all.filter(l=>!isPlanning(l));const a=logs.filter(l=>l.mediaType==='anime'),m=logs.filter(l=>l.mediaType==='manga');
 const scored=logs.filter(l=>rnum(l)!==null);const mean=scored.length?(scored.reduce((s,l)=>s+rnum(l),0)/scored.length).toFixed(1):'—';
 const vals=onlyAnime?[[a.length,'Anime'],[m.length,'Manga'],[a.filter(l=>l.status==='Completed').length,'Anime completed'],[m.filter(l=>l.status==='Completed').length,'Manga completed']]:[[logs.length,'Entries'],[logs.filter(l=>l.status==='Completed').length,'Completed'],[all.filter(isPlanning).length,'Planning'],[mean,'Mean score']];
 return `<div class="mt-skin-stats">${vals.map(([num,title])=>`<div><b>${esc(num)}</b><small>${esc(title)}</small></div>`).join('')}</div>`;
}
function mtSkinActivity(all){const recent=mtSkinOrdered(all).slice(0,12);return recent.length?`<div class="mt-skin-activity">${recent.map(l=>`<button type="button" class="mt-skin-activityrow" data-profile-media-type="${esc(l.mediaType)}" data-profile-title="${esc(l.title)}" data-profile-cover="${esc(l.cover||'')}" data-profile-year="${esc(l.year||'')}" data-profile-media-key="${esc(l.mediaKey||'')}" data-profile-status="${esc(l.status||'')}" data-profile-progress="${Number(l.progress)||0}" data-profile-rating="${l.rating??''}" onclick="openProfilePosterDetails(this)"><span class="mt-skin-acticon">${TYPES[l.mediaType]?.icon||ico('book')}</span><span><strong>${esc(l.title)}</strong><small>${esc(l.status||'Logged')} · ${esc(TYPES[l.mediaType]?.label||l.mediaType)}</small></span><time>${esc(timeAgo(l.updatedAt))}</time></button>`).join('')}</div>`:'<p class="mt-skin-empty">No media activity yet.</p>'}
function mtSkinStatusBar(type,all){const statuses=['All','Completed','In progress','Planning','On hold','Dropped'];const current=state.profileStatus||'All';return `<div class="mt-skin-filters">${statuses.map(s=>{const n=all.filter(l=>l.mediaType===type&&(s==='All'||l.status===s)).length;return `<button type="button" class="mt-skin-filter ${current===s?'active':''}" onclick="setProfileStatus('${s}')">${s} <span>${n}</span></button>`}).join('')}</div>`}
function mtSkinMediaList(type,all){const title=TYPES[type]?.label||'Media',items=all.filter(l=>l.mediaType===type),status=state.profileStatus||'All',shown=mtSkinOrdered(items.filter(l=>status==='All'||l.status===status));return mtSkinGroup(title+' list',mtSkinStatusBar(type,all)+mtSkinGrid(shown,'Nothing saved in this list yet.')+profileResetFooter(type,status,shown.length),`<small>${shown.length} entries</small>`)}
function mtSkinAllMedia(all){const types=[...new Set(all.map(l=>l.mediaType))].filter(Boolean);return `<div class="mt-skin-filters">${types.map(k=>`<button type="button" class="mt-skin-filter" onclick="setProfileTab('${esc(k)}')">${esc(TYPES[k]?.label||k)} · ${all.filter(l=>l.mediaType===k).length}</button>`).join('')}</div>`}
function mtSkinScoreDistribution(all){const rated=all.filter(l=>rnum(l)!==null&&Number.isFinite(rnum(l))),vals=[0,0,0,0,0];rated.forEach(l=>{vals[Math.min(4,Math.max(0,Math.ceil(rnum(l)/2)-1))]++});const max=Math.max(1,...vals);return `<div class="mt-skin-score-bars">${vals.map((n,i)=>`<div><span>${i*2+1}–${i*2+2}</span><div class="mt-skin-score-track"><i style="width:${Math.round(n/max*100)}%"></i></div><b>${n}</b></div>`).join('')}</div>`}
// v90: screenshot-grounded profile renderers. Original Theme is not touched.
function mtRefDateValue(raw){const x=Number(raw);return Number.isFinite(x)&&x>0?new Date(x<1e11?x*1000:x):new Date(raw||0)}
function mtRefCover(l,extra='',eager=false){
 const future=mtProfileLayout(state.profile)==='future',custom=future?(state.profile?.futureCovers?.[l.mediaKey]||''):'',raw=custom||l.cover||'',src=/^data:image\/(?:png|jpeg|webp|gif|avif);base64,/i.test(raw)?raw:catalogCoverSrc(raw),type=TYPES[l.mediaType]||{};
 const pic=src?`<img class="mt-ref-cover-img pf-img ${extra}" src="${esc(src)}" alt="${esc(l.title||'Media')} cover" loading="${eager?'eager':'lazy'}" decoding="async" data-media-type="${esc(l.mediaType)}" data-title="${esc(l.title)}" data-cover-original="${esc(l.cover||'')}" onerror="profileCoverFailed(this)">`:`<span class="mt-ref-cover-img mt-ref-empty pf-img" data-profile-cover-missing="1" data-media-type="${esc(l.mediaType)}" data-title="${esc(l.title)}" role="img" aria-label="Cover unavailable for ${esc(l.title)}">${type.icon||ico('book')}</span>`;
 const poster=`<button type="button" class="mt-ref-poster ${extra}" title="${esc(l.title||'Media')}" data-profile-media-type="${esc(l.mediaType)}" data-profile-title="${esc(l.title)}" data-profile-cover="${esc(custom||l.cover||'')}" data-profile-year="${esc(l.year||'')}" data-profile-media-key="${esc(l.mediaKey||'')}" data-profile-status="${esc(l.status||'')}" data-profile-progress="${Number(l.progress)||0}" data-profile-rating="${l.rating==null?'':Number(l.rating)}" data-profile-note="${esc(l.note||'')}" onclick="openProfilePosterDetails(this)">${pic}${rnum(l)!==null?`<span class="mt-ref-rating">${rnum(l).toFixed(1)} ★</span>`:''}<span class="mt-ref-cover-name">${esc(l.title)}</span></button>`;
 if(!future)return poster;
 return `<div class="mt-ref-poster-slot">${poster}${mtSkinOwn()&&l.mediaKey?`<button class="mt-future-cover-edit" type="button" data-cover-key="${esc(l.mediaKey)}" title="Change artwork for ${esc(l.title)}" aria-label="Change artwork for ${esc(l.title)}" onclick="mtFutureEditCover(this)">${ico('edit')}</button>`:''}</div>`;
}
function mtFutureEditCover(el){if(!mtSkinOwn())return;const key=el.dataset.coverKey,entry=(state.profileLogs||[]).find(x=>x.mediaKey===key);if(!entry)return toast('Cannot find this media entry.','error');const current=state.profile?.futureCovers?.[key]||'';window.mtFutureEditingKey=key;window.mtFutureUploadedImage=/^data:image\//.test(current)?current:'';
 document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal mt-future-art-modal" role="dialog" aria-modal="true" aria-label="Change media artwork"><header><h2>Change cover image</h2><button class="md-close" onclick="closeModal()" aria-label="Close">${ico('x')}</button></header><p><strong>${esc(entry.title)}</strong> — this artwork only changes how the title appears in your Future Theme.</p><img id="mtFutureArtPreview" src="${esc(current||entry.cover||'')}" alt="Artwork preview" onerror="this.style.visibility='hidden'"/><label for="mtFutureArtUrl">Image URL</label><input id="mtFutureArtUrl" class="field" placeholder="https://example.com/cover.jpg" value="${esc(/^https:\/\//.test(current)?current:'')}" oninput="window.mtFutureUploadedImage='';mtFuturePreviewImage(this.value)"><p class="sub">Or upload your own image. Large photos will be compressed for the profile.</p><input id="mtFutureArtFile" type="file" accept="image/png,image/jpeg,image/webp,image/avif" onchange="mtFutureUploadImage(this)"><div class="modal-actions"><button class="btn white" onclick="mtFutureSaveCover(true)">Restore default</button><button class="btn light" onclick="closeModal()">Cancel</button><button id="mtFutureArtSave" class="btn primary" onclick="mtFutureSaveCover(false)">Save artwork</button></div></section></div>`;}
function mtFuturePreviewImage(src){const node=document.getElementById('mtFutureArtPreview');if(!node)return;node.style.visibility='visible';node.src=/^https:\/\//i.test(src)?src:''}
async function mtFutureUploadImage(input){const file=input?.files?.[0];if(!file)return;try{if(!/^image\/(?:png|jpeg|webp|avif)$/.test(file.type))throw new Error('Choose a supported image.');let data=await mtProfileImageData(file);if(data.length>160000){const image=new Image();image.src=data;await image.decode();let width=Math.min(540,image.naturalWidth),height=Math.round(image.naturalHeight*width/image.naturalWidth);let packed='';for(let i=0;i<7;i++){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);packed=canvas.toDataURL('image/webp',Math.max(.42,.74-i*.055));if(packed.length<=160000)break;width=Math.max(150,Math.round(width*.78));height=Math.max(210,Math.round(height*.78))}data=packed;}if(data.length>160000)throw new Error('Image is too large after compression. Use an HTTPS link.');window.mtFutureUploadedImage=data;const preview=document.getElementById('mtFutureArtPreview');preview.style.visibility='visible';preview.src=data;toast('Custom image ready to save.','success')}catch(e){toast(e.message||'Unable to load image','error')}}
async function mtFutureReload(){const name=state.profile?.name;if(!name)return;await loadProfile(name);closeModal();render()}
async function mtFutureSaveCover(reset=false){if(!mtSkinOwn()||!window.mtFutureEditingKey)return;const btn=document.getElementById('mtFutureArtSave');if(btn)btn.disabled=true;try{const value=reset?'':(window.mtFutureUploadedImage||document.getElementById('mtFutureArtUrl')?.value.trim()||'');if(!reset&&!value)throw new Error('Choose an image or select Restore default.');await api('/api/profile/future-visual',{method:'POST',body:JSON.stringify({kind:'cover',key:window.mtFutureEditingKey,value})});window.mtFutureEditingKey='';window.mtFutureUploadedImage='';await mtFutureReload();toast(reset?'Default artwork restored.':'Cover updated.','success')}catch(e){toast(e.message||'Could not save artwork','error');if(btn)btn.disabled=false}}

function mtRefGrid(logs,cls='',limit=0){const arr=limit?logs.slice(0,limit):logs;return arr.length?`<div class="mt-ref-grid ${cls}">${arr.map((l,i)=>mtRefCover(l,'',i<5)).join('')}</div>`:'<div class="mt-ref-no-data">Nothing added yet.</div>'}
function mtRefProgress(total,goal){const value=Math.min(100,Math.round(total/Math.max(goal,1)*100));return `<div class="mt-ref-meter"><div class="mt-ref-meter-marks"><span>0</span><span>${Math.round(goal/2)}</span><span>${goal}</span></div><div class="mt-ref-meter-track"><span style="width:${value}%"></span></div></div>`}
function mtRefHeatmap(all){const dayCounts=new Map();for(const l of all){const d=mtRefDateValue(l.updatedAt);if(!Number.isFinite(d.valueOf())||d.getFullYear()<2020)continue;const k=d.toISOString().slice(0,10);dayCounts.set(k,(dayCounts.get(k)||0)+1)}const today=new Date();today.setHours(12,0,0,0);const day=(today.getDay()+6)%7,first=new Date(today);first.setDate(today.getDate()-day-7*48);const cells=[];for(let i=0;i<343;i++){const d=new Date(first);d.setDate(first.getDate()+i);const key=d.toISOString().slice(0,10),n=d<=today?(dayCounts.get(key)||0):0;cells.push(`<button type="button" class="mt-ref-heat-cell ${n?'is-'+Math.min(4,n):''}" title="${key} · ${n} updated entries" aria-label="${key}: ${n} updated entries" onclick="mtRefSelectDay('${key}')"></button>`)}return `<div class="mt-ref-heatmap">${cells.join('')}</div><small class="mt-ref-heat-note">Recent profile updates · Select a day to filter activity</small>`}
function mtRefSelectDay(day){const target=state.mtAnimeDate===day?'':day;setProfileTab('overview');state.mtAnimeDate=target;const app=document.getElementById('app');if(app){app.innerHTML=shell(profilePage(),false);hydrateProfileCovers(app)}}
function mtRefGenres(all){const counts=new Map();for(const l of all){let arr=l.genres||l.genre||[];if(typeof arr==='string')arr=arr.split(/[,|]/);if(!Array.isArray(arr))continue;for(const x of arr){const name=typeof x==='string'?x.trim():x?.name;if(name)counts.set(name,(counts.get(name)||0)+1)}}const sorted=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,4);const tones=['#62d62c','#04b5fe','#8f55ed','#f877a6'];const total=sorted.reduce((a,b)=>a+b[1],0);return sorted.length?`<div class="mt-ref-genre-box"><div class="mt-ref-genres">${sorted.map(([name,n],i)=>`<div style="--genre:${tones[i]}"><span>${esc(name)}</span><small>${n} Entries</small></div>`).join('')}</div><div class="mt-ref-genre-meter">${sorted.map(([name,n],i)=>`<span style="width:${n/total*100}%;background:${tones[i]}"></span>`).join('')}</div></div>`:`<div class="mt-ref-no-data mt-ref-genre-box">Genre statistics appear when your logged media contains genre metadata.</div>`}
function mtRefAnimeActivity(all,day){let logs=mtSkinOrdered(all);if(day)logs=logs.filter(l=>mtRefDateValue(l.updatedAt).toISOString().slice(0,10)===day);return logs.length?`<div class="mt-ref-feed">${logs.slice(0,30).map(l=>{const action=l.status==='Completed'?'Completed':l.status==='In progress'?'Updated':'Added';return `<div class="mt-ref-feed-row"><div class="mt-ref-feed-image">${mtRefCover(l,'',true)}</div><button type="button" class="mt-ref-feed-caption" data-profile-media-type="${esc(l.mediaType)}" data-profile-title="${esc(l.title)}" data-profile-cover="${esc(l.cover||'')}" data-profile-media-key="${esc(l.mediaKey||'')}" data-profile-status="${esc(l.status||'')}" data-profile-progress="${Number(l.progress)||0}" onclick="openProfilePosterDetails(this)">${esc(action)} <strong>${esc(l.title)}</strong>${Number(l.progress)>0?` · ${esc(mtProgressUnit(l.mediaType))} ${Number(l.progress)}`:''}</button><span class="mt-ref-feed-time">${esc(timeAgo(l.updatedAt))}</span></div>`}).join('')}</div>`:'<div class="mt-ref-no-data">No activity found for this day.</div>'}
function mtRefAnimeTop(u){return `<div class="mt-ref-anime-top"><span class="mt-ref-anime-logo-space" aria-hidden="true"></span><nav aria-label="Main navigation"><button onclick="goView('home')">Home</button><button onclick="location.href='${userLink(u.name)}'">Profile</button><button onclick="setProfileTab('anime')">Anime List</button><button onclick="setProfileTab('manga')">Manga List</button><button onclick="goView('discover')">Browse</button><button onclick="goView('forum')">Forum</button></nav><div class="mt-ref-anime-topright"><button onclick="goView('discover')" aria-label="Search">${ico('search')}</button><button onclick="${mtSkinOwn()?'openProfileEditor()':`location.href='${userLink(state.me?.name||u.name)}'`}" aria-label="Profile settings">${profileAvatar(u,42,'mt-ref-topavatar')}</button></div></div>`}
function mtRefAnimeBanner(u){return `<div class="mt-ref-anime-banner" style="${bannerStyle(u)}"><div class="mt-ref-anime-banner-overlay"></div><div class="mt-ref-anime-id">${profileAvatar(u,200,'mt-ref-anime-avatar')}<h1>${esc(u.name)}</h1></div>${mtSkinOwn()?`<button class="mt-ref-anime-edit" type="button" onclick="openProfileEditor()">Edit profile</button>`:`<button class="mt-ref-anime-edit" onclick="toggleFollow('${esc(u.name)}',${!!u.isFollowing})">${u.isFollowing?'Following':'Follow'}</button>`}</div>`}
function mtRefAnimeStats(all){const anime=all.filter(l=>l.mediaType==='anime'&&!isPlanning(l)),manga=all.filter(l=>l.mediaType==='manga'&&!isPlanning(l));const episodes=anime.reduce((s,l)=>s+Math.max(0,Number(l.progress)||0),0),chapters=manga.reduce((s,l)=>s+Math.max(0,Number(l.progress)||0),0);const valsA=[[anime.length,'Total Anime'],[(episodes*24/1440).toFixed(1),'Est. Days Watched'],[episodes,'Episodes Watched']];const valsM=[[manga.length,'Total Manga'],[chapters,'Chapters Read'],[manga.reduce((s,l)=>s+Math.max(0,Number(l.volumesRead)||0),0),'Volumes Read']];const unit=(vals,goal)=>`<section class="mt-ref-stat-panel"><div class="mt-ref-stat-metrics">${vals.map(([n,k])=>`<div><b>${esc(n)}</b><span>${esc(k)}</span></div>`).join('')}</div>${mtRefProgress(Number(vals[0][0]),goal)}</section>`;return unit(valsA,Math.max(50,Math.ceil(anime.length/25)*25))+unit(valsM,Math.max(50,Math.ceil(manga.length/25)*25))}
function mtAnimeProfilePage(u){

 else if(tab==='submissions')content=`<section class="mt-ref-anime-wide"><h2>Submissions</h2><p>Media added to MediaTok can be found in your Anime List, Manga List, and other collections.</p><button onclick="goView('discover')">Browse catalog</button></section>`;
 else content=`<div class="mt-ref-anime-overview"><aside class="mt-ref-anime-left"><h3>Activity History</h3><section class="mt-ref-panel">${mtRefHeatmap(all)}</section><h3>Genre Overview</h3>${mtRefGenres(all)}<h3>Anime</h3><section class="mt-ref-panel">${mtRefGrid(favorites.filter(l=>l.mediaType==='anime').concat(anime.filter(l=>!favorites.includes(l))).slice(0,5))}</section><h3>Manga</h3><section class="mt-ref-panel">${mtRefGrid(favorites.filter(l=>l.mediaType==='manga').concat(manga.filter(l=>!favorites.includes(l))).slice(0,5))}</section></aside><main class="mt-ref-anime-right">${mtRefAnimeStats(all)}<div class="mt-ref-activity-header"><h3>Activity</h3>${state.mtAnimeDate?`<button onclick="state.mtAnimeDate='';setProfileTab('overview')">Clear ${esc(state.mtAnimeDate)} filter ×</button>`:''}</div>${mtRefAnimeActivity(all,state.mtAnimeDate)}</main></div>`;

async function mtRefHydrateCircle(){const target=document.getElementById('mtRefCirclePeople'),username=state.profile?.name;if(!target||!username)return;let users=[];try{const response=await api('/api/profile/'+encodeURIComponent(username)+'/followers');users=(response.users||[]).slice(0,7)}catch{return}if(!target.isConnected||state.profile?.name!==username)return;if(!users.length){target.innerHTML=`<button onclick="showProfileConnections('followers')">${ico('user')}<span>No followers yet</span></button>`;return}
 const own=state.profileLogs||[];const ownNames=new Set(own.map(l=>String(l.mediaType)+'|'+String(l.title).trim().toLowerCase()));target.innerHTML=users.map((u,i)=>`<button onclick="location.href='${userLink(u.name)}'">${profileAvatar({...u,globalName:u.global_name||u.name,avatarUrl:u.avatar_url||u.avc},68,'mt-ref-circle-avatar')}<span>${esc(u.global_name||u.name)}</span><small id="mtRefMatch${i}">Member</small></button>`).join('');
 // Progressive, bounded similarity calculation. Never show fabricated percentages.
 const compare=async(i)=>{try{const x=users[i],data=await api('/api/profile/'+encodeURIComponent(x.name)),theirs=new Set((data.logs||[]).map(l=>String(l.mediaType)+'|'+String(l.title).trim().toLowerCase()));const union=new Set([...ownNames,...theirs]);const shared=[...ownNames].filter(key=>theirs.has(key)).length;const result=union.size?Math.round(shared/union.size*100):0;const el=document.getElementById('mtRefMatch'+i);if(el&&state.profile?.name===username){el.textContent=result+'% shared';el.setAttribute('aria-label',result+' percent shared titles')}}catch{}};

async function anilistGraphQL(query,variables){const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables})});let j={};try{j=await r.json()}catch{}if(!r.ok||j.errors){const msg=j.errors?.[0]?.message||`AniList request failed (${r.status}).`;if(/blocked|principal|temporarily disabled/i.test(msg))throw new Error('AniList is blocking this network request. Try again later; MediaTok cannot override AniList IP blocks.');throw new Error(msg)}return j.data}
async function linkExternal(service,doImport=false){const label=service==='mal'?'MyAnimeList':service==='letterboxd'?'Letterboxd':service==='vndb'?'VNDB':'AniList';const username=($('#link-'+service)?.value||'').trim()||prompt(`Enter your ${label} username`);if(!username)return;try{let out;if(service==='anilist'){const q='query($name:String!){User(name:$name){name siteUrl avatar{large} statistics{anime{count meanScore episodesWatched} manga{count meanScore chaptersRead}}}}';const d=await anilistGraphQL(q,{name:username.trim().replace(/^@/,'')});const p=d.User;if(!p)throw new Error('Could not find that public AniList profile.');out=await api('/api/links/save',{method:'POST',body:JSON.stringify({service,username:p.name,profile:{url:p.siteUrl,avatar:p.avatar?.large||'',anime:p.statistics?.anime||{},manga:p.statistics?.manga||{}}})})}else{out=await api('/api/links',{method:'POST',body:JSON.stringify({service,username})})}state.me=(await api('/api/me')).user;if(doImport){await syncExternal(service)}else{toast(`${label} linked: @${out.username}`);openProfileEditor()}}catch(e){toast(e.message)}}
async function importByUsername(service){const username=($('#link-'+service)?.value||'').trim();if(!username)return toast('Enter the public username first.');await linkExternal(service,true)}
function parseImportCSV(input){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<input.length;i++){const c=input[i];if(c==='"'&&input[i+1]==='"'&&quoted){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&input[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function normalImportEntries(text,service,filename){const cleanName=filename.replace(/\.gz$/i,'');const ext=(cleanName.split('.').pop()||'').toLowerCase();let records=[];if(ext==='json'||/^\s*[\[{]/.test(text)){let obj=JSON.parse(text);if(Array.isArray(obj))records=obj;else{for(const k of ['anime','manga','entries','data','items','list','lists'])if(Array.isArray(obj?.[k]))records.push(...obj[k]);if(!records.length&&obj&&typeof obj==='object')records=Object.values(obj).flatMap(x=>Array.isArray(x)?x:(x&&typeof x==='object'?[x]:[]))}}else if(ext==='xml'||/<(?:anime|manga|myanimelist|animelist|mangalist)\b/i.test(text)){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('The XML file could not be read. Choose the original AniList or MAL export.');records=[...doc.querySelectorAll('anime, manga, entry, media')].map(el=>{const o={};for(const child of el.children)o[child.tagName.toLowerCase()]=child.textContent.trim();return o})}else{const rows=parseImportCSV(text);if(rows.length<2)throw new Error('This file has no list rows.');const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[ _-]+/g,'_'));records=rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }
const val=(o,keys)=>{for(const k of keys){if(o[k]!==undefined&&o[k]!==null&&String(o[k]).trim()!=='')return o[k]}return ''};return records.map((o,i)=>{const title=val(o,['title','series_title','manga_title','name','english_title','romaji_title']);if(!title)return null;const typeRaw=String(val(o,['type','media_type','kind','format','media_format'])||'').toLowerCase();const formatRaw=String(val(o,['format','media_format','series_type'])||'').toLowerCase();let type=/light[ _-]*novel|\bnovel\b/.test(typeRaw+' '+formatRaw)?'light-novel':(/manga|manhwa|manhua/.test(typeRaw)||('manga_title'in o)||('my_read_chapters'in o)||('my_read_volumes'in o)?'manga':'anime');const id=val(o,['id','media_id','series_animedb_id','manga_mangadb_id','anilist_id','mal_id']);const status=val(o,['status','my_status','my_watched_status','my_read_status','list_status']);const progress=val(o,['progress','my_watched_episodes','my_read_chapters','episodes_watched','chapters_read']);const score=val(o,['score','my_score','rating']);const year=val(o,['year','series_start','start_date','startdate']);const cover=val(o,['cover','image','image_url','cover_url']);let rating=score===''?null:Number(score);if(rating!==null&&Number.isFinite(rating)&&rating>10)rating=rating/10;if(rating!==null&&!Number.isFinite(rating))rating=null;return {key:`${service}:file:${id||type+':'+String(title).toLowerCase().replace(/[^a-z0-9]+/g,'-')}`,type,title:String(title).slice(0,200),cover:/^https:\/\//i.test(String(cover))?String(cover):'',year:String(year).slice(0,4),status:String(status||'Planning'),progress:Math.max(0,Number(progress)||0),rating}}).filter(Boolean)}
async function readImportText(blob,name){if(/\.gz$/i.test(name)){if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot decompress the .gz export. Download the uncompressed XML/CSV export instead.');const stream=blob.stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}return await blob.text()}
async function importListFile(service){const file=$('#'+service+'File')?.files?.[0];if(!file)return toast('Choose an export file first.');try{let entries=[];if(file.name.toLowerCase().endsWith('.zip')){if(!window.JSZip)throw new Error('The ZIP reader did not load. Refresh and try again, or choose an extracted XML/CSV file.');const zip=await JSZip.loadAsync(file);const files=Object.values(zip.files).filter(f=>!f.dir&&/\.(xml|csv|json)(\.gz)?$/i.test(f.name));for(const item of files){let blob=await item.async('blob');const text=await readImportText(blob,item.name);try{entries.push(...normalImportEntries(text,service,item.name))}catch(e){if(!/no anime or manga|no list rows/i.test(e.message))throw e}}}else{const text=await readImportText(file,file.name);entries=normalImportEntries(text,service,file.name)}const unique=new Map(entries.map(x=>[x.key,x]));entries=[...unique.values()];if(!entries.length)throw new Error(`No anime or manga titles were found in ${file.name}. For MyAnimeList, choose the downloaded .xml.gz file or export ZIP; for AniList, choose the list export CSV/JSON/XML or export ZIP, not a profile page or unrelated file.`);const out=await api('/api/import/external',{method:'POST',body:JSON.stringify({service,entries})});state.me=(await api('/api/me')).user;await refreshFeed();closeModal();render();toast(`Import complete: ${out.imported} entries saved.`,'success')}catch(e){toast(e.message||'Import failed. Please check the file and try again.','error')}}
async function importLetterboxdCsv(){const file=$('#letterboxdCsv')?.files?.[0];if(!file)return toast('Choose your Letterboxd diary CSV first.','error');toast('Importing Letterboxd entries…','loading');try{const text=(await file.text()).replace(/^\uFEFF/,'');const rows=parseImportCSV(text);if(rows.length<2)throw new Error('The CSV appears to be empty.');const norm=s=>String(s||'').replace(/^\uFEFF/,'').trim().toLowerCase();const headers=rows[0].map(norm);const pick=(row,names)=>{for(const name of names){const i=headers.indexOf(name);if(i>=0&&row[i]!==undefined)return row[i].trim()}return ''};const entries=rows.slice(1).map(row=>({title:pick(row,['name','film title','title']),year:pick(row,['year']),watchedDate:pick(row,['watched date','date']),rating:pick(row,['rating']),uri:pick(row,['letterboxd uri','uri'])})).filter(x=>x.title);if(!entries.length)throw new Error('No film titles were found. Please choose the Letterboxd diary CSV (usually diary.csv), not a different export file.');let imported=0;for(let i=0;i<entries.length;i+=50){const batch=entries.slice(i,i+50);toast(`Importing Letterboxd: ${Math.min(i+batch.length,entries.length)} / ${entries.length}…`,'loading');const out=await api('/api/import/letterboxd',{method:'POST',body:JSON.stringify({entries:batch})});imported+=Number(out.imported)||0}if(!imported)throw new Error('No films were imported. Check that you selected the Letterboxd diary CSV.');state.me=(await api('/api/me')).user;await refreshFeed();closeModal();render();toast(`Import complete: ${imported} entries saved from ${entries.length} rows.`,'success')}catch(e){toast(e.message||'Letterboxd import failed. Nothing more was imported.','error')}}
async function syncExternal(service){try{let out;try{out=await api('/api/links/sync',{method:'POST',body:JSON.stringify({service})})}catch(serverError){

// Accept high-resolution photos without the old 400 KB file-selection rejection.
// Convert larger images to efficient WebP because profile images live in D1 text
// (the Worker intentionally bounds saved data URLs to protect query costs).
async function mtProfileImageData(file){
 if(!/^image\/(png|jpeg|webp|gif|avif)$/.test(file.type))throw new Error('Choose a PNG, JPG, WebP, AVIF, or GIF image.');
 if(file.size<=400*1024){return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result||''));fr.onerror=()=>reject(new Error('Could not read the image.'));fr.readAsDataURL(file)})}
 let img,objectUrl='';
 try{
   objectUrl=URL.createObjectURL(file);
   img=new Image(); img.decoding='async';img.src=objectUrl;
   await img.decode();
   const maxPixels=2300,scale=Math.min(1,maxPixels/Math.max(img.naturalWidth,img.naturalHeight));
   let w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
   for(let attempt=0;attempt<9;attempt++){
     const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
     const context=canvas.getContext('2d',{alpha:true});if(!context)throw new Error('Image conversion is not supported in this browser.');
     context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';context.drawImage(img,0,0,w,h);
     const quality=Math.max(.55,.87-attempt*.045);
     const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
     if(!blob)throw new Error('Could not compress this image.');
     if(blob.size<=390*1024){return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result||''));fr.onerror=()=>reject(new Error('Could not process the image.'));fr.readAsDataURL(blob)})}
     w=Math.max(250,Math.round(w*.82));h=Math.max(140,Math.round(h*.82));
   }
   throw new Error('This picture could not be optimized for the profile. Try a direct HTTPS image link.');
 }finally{if(objectUrl)URL.revokeObjectURL(objectUrl)}
}

function mtSyncProfileAtmosphere(){

 if(mtAtmosphereNode===node)return;
 mtStopProfileAtmosphere();mtAtmosphereNode=node;

 if(layout)layout.classList.remove('mt-profile-fx-on');
 const social=state.profile?.socials||{},bg=node.querySelector('.mt-profile-background');
 const image=String(social.profileBackground||'');
 if(social.profileBackgroundEnabled===true&&(image.startsWith('https://')||/^data:image\/(?:png|jpeg|webp|gif|avif);base64,/i.test(image))){
  bg.style.backgroundImage='url('+JSON.stringify(image)+')';node.classList.add('has-background');
 }
 const color=/^#[0-9a-f]{6}$/i.test(String(social.profileFxColor||''))?social.profileFxColor:'#b59afc';

}

 const composer=state.me?`<div class="mt-live-send"><div class="mt-live-preview" id="mtLivePreview" hidden><img id="mtLivePreviewImg" alt="Selected image"><div><div class="sub" id="mtLivePreviewLabel">Image selected</div><button class="textbtn" type="button" onclick="forumLiveRemoveImage()">Remove image</button></div></div><div id="mtLiveReplyPreview" class="mt-live-reply-preview" hidden></div><div class="mt-live-compose"><button class="mt-live-add" type="button" title="Attach an image" aria-label="Attach an image" onclick="document.getElementById('mtLiveFile')?.click()">＋</button><input id="mtLiveFile" class="mt-live-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="forumLiveChooseImage(this)"><textarea id="mtLiveInput" class="mt-live-input" maxlength="1000" rows="1" placeholder="Message the community…" aria-label="Chat message" onkeydown="forumLiveKeyDown(event)" oninput="forumLiveMentionSuggest()"></textarea><button class="mt-live-emoji-trigger" type="button" title="Pick an emoji" aria-label="Choose emoji" onclick="forumLiveToggleEmoji()">☺</button><button class="btn primary mt-live-sendbtn" type="button" id="mtLiveSend" onclick="forumLiveSend()">Send</button></div><div id="mtLiveEmojiPicker" class="mt-live-emoji-picker" hidden>${['😀','😂','😍','🥹','🔥','👍','❤️','🎉','💀','😭','💯','👀','✨','🙏'].map(e=>`<button type="button" onclick="forumLiveInsertEmoji('${e}')">${e}</button>`).join('')}</div><div id="mtLiveMentionPopup" class="mt-live-mention-popup" hidden></div><div class="mt-live-note"><span>Enter to send · Shift+Enter for a new line · Images up to 700 KB</span><span id="mtLiveStatus" class="mt-live-status"></span></div></div>`:`<div class="mt-live-login">Sign in to chat and share images. You can still read the conversation.</div>`;
 return `<section class="mt-live" id="mtLive" aria-label="Live community chat"><header class="mt-live-head"><div class="mt-live-title"><span class="mt-live-dot" id="mtLiveDot" aria-hidden="true"></span><h2>Live chat</h2><span class="pill"># general</span></div><div class="mt-live-meta"><span id="mtLiveOnline">Connecting…</span><span class="mt-live-hour" id="mtLiveCountdown">Resets hourly</span></div></header><div class="mt-live-list" id="mtLiveList" role="log" aria-live="off" aria-label="Recent live messages"><div class="mt-live-empty"><b>Connecting to the room…</b><span>Messages and images clear automatically every hour.</span></div></div>${composer}</section>`;
}
function forumLiveStop(){
 forumLiveManualClose=true;
 clearTimeout(forumLiveReconnect);clearInterval(forumLiveTimer);
 forumLiveReconnect=null;forumLiveTimer=null;
 const sock=forumLiveSocket;forumLiveSocket=null;
 if(sock){sock.onclose=null;sock.onerror=null;sock.onmessage=null;try{sock.close(1000,'Leaving forum')}catch{}}
 forumLiveUpload=null;forumLiveReplyTo=null;
}
function forumLiveSetStatus(message){forumLiveStatus=message;const status=$('#mtLiveStatus');if(status)status.textContent=message;}
function forumLiveClock(){
 const el=$('#mtLiveCountdown');if(!el)return;
 const left=Math.max(0,forumLiveNextReset-Date.now());
 const m=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);
 el.textContent=forumLiveNextReset?`Resets in ${m}:${String(sec).padStart(2,'0')}`:'Resets every hour';
 // If a network outage spans the reset, never keep showing old messages.
 if(forumLiveNextReset && Date.now()>forumLiveNextReset+1000 && forumLiveHour!==Math.floor(Date.now()/3600000)) {
   forumLiveHour=Math.floor(Date.now()/3600000);forumLiveMsgs=[];forumLiveClearReply();forumLivePaint(true);
   forumLiveNextReset=(forumLiveHour+1)*3600000;
 }
}
function forumLivePaint(stick=false){
 const list=$('#mtLiveList');if(!list)return;
 const closeToBottom=list.scrollHeight-list.scrollTop-list.clientHeight<90;
 const last=Math.floor(Date.now()/3600000);
 forumLiveMsgs=forumLiveMsgs.filter(x=>Number(x.created_at)>=last*3600000);
 list.innerHTML=forumLiveMsgs.length?forumLiveMsgs.slice(-100).map(m=>{
   const own=state.me&&String(state.me.id)===String(m.user_id);
   const mayDelete=own||state.me&&['owner','admin','moderator'].includes(state.me.role);
   const role=['owner','admin','moderator'].includes(m.role)?`<span class="mt-live-role">${esc(m.role)}</span>`:'';
   const ref=m.reply_to?forumLiveMsgs.find(x=>x.id===m.reply_to):null;
   const reply=ref?`<button class="mt-live-quoted" type="button" onclick="forumLiveJump('${esc(ref.id)}')"><b>↳ ${esc(ref.author)}</b><span>${esc((ref.body||'Image').slice(0,100))}</span></button>`:'';
   const picture=m.image_id?`<a href="/api/forum/live/images/${encodeURIComponent(m.image_id)}" target="_blank" rel="noopener noreferrer" aria-label="Open image"><img class="mt-live-picture" loading="lazy" src="/api/forum/live/images/${encodeURIComponent(m.image_id)}" alt="Photo shared by ${esc(m.author)}" onerror="this.closest('a').remove()"></a>`:'';
   const emotes=(m.reactions||[]).map(r=>`<button class="mt-live-reaction" type="button" onclick="forumLiveReact('${esc(m.id)}','${esc(r.emoji)}')">${esc(r.emoji)} <span>${Number(r.count)||0}</span></button>`).join('');
   return `<div class="mt-live-msg" data-msg="${esc(m.id)}"><a class="mt-live-profile-link" href="${userLink(m.author)}" title="View @${esc(m.author)}'s profile">${avatar({name:m.author,avc:m.avatar},33)}</a><div class="mt-live-main"><div class="mt-live-byline"><a href="${userLink(m.author)}"><b>${esc(m.author)}</b></a>${role}<time>${new Date(Number(m.created_at)).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time></div>${reply}${m.body?`<div class="mt-live-text">${forumLiveFormatMentions(m.body)}</div>`:''}${picture}<div class="mt-live-actions"><button type="button" class="mt-live-action" onclick="forumLiveSetReply('${esc(m.id)}')">Reply</button>${state.me?`<button type="button" class="mt-live-action" onclick="forumLiveReact('${esc(m.id)}','❤️')">♡ React</button>`:''}${emotes}</div></div>${mayDelete?`<button class="mt-live-delete" type="button" aria-label="Delete message" title="Delete message" onclick="forumLiveDelete('${esc(m.id)}')">✕</button>`:''}</div>`;
 }).join(''):`<div class="mt-live-empty"><b>It’s quiet in here</b><span>Be the first to say something. Chat clears every hour.</span></div>`;
 if(stick||closeToBottom)list.scrollTop=list.scrollHeight;
}
function forumLiveFormatMentions(body){
 return esc(body).replace(/(^|[^\w])@([A-Za-z0-9_-]{3,24})\b/g,(whole,prefix,name)=>`${prefix}<span class="mt-live-ping ${state.me&&name.toLowerCase()===String(state.me.name).toLowerCase()?'mine':''}">@${name}</span>`);
}
function forumLiveJump(id){const node=document.querySelector(`[data-msg="${id}"]`);node?.scrollIntoView({block:'nearest',behavior:'smooth'});node?.classList.add('mt-live-flash');setTimeout(()=>node?.classList.remove('mt-live-flash'),1200)}
function forumLiveSetReply(id){
 const message=forumLiveMsgs.find(m=>m.id===id);if(!message)return;
 forumLiveReplyTo=id;const el=$('#mtLiveReplyPreview');if(el){el.hidden=false;el.innerHTML=`<span>Replying to <b>@${esc(message.author)}</b> · ${esc((message.body||'Image').slice(0,80))}</span><button type="button" onclick="forumLiveClearReply()" aria-label="Cancel reply">✕</button>`;}$('#mtLiveInput')?.focus();
}
function forumLiveClearReply(){forumLiveReplyTo=null;const el=$('#mtLiveReplyPreview');if(el){el.hidden=true;el.innerHTML='';}}
function forumLiveReact(id,emoji){if(!state.me)return login();if(forumLiveSocket?.readyState===WebSocket.OPEN)forumLiveSocket.send(JSON.stringify({type:'react',id,emoji}));}
function forumLiveToggleEmoji(){const el=$('#mtLiveEmojiPicker');if(el)el.hidden=!el.hidden;}
function forumLiveInsertEmoji(emoji){const field=$('#mtLiveInput');if(!field)return;const start=field.selectionStart,end=field.selectionEnd;field.setRangeText(emoji,start,end,'end');$('#mtLiveEmojiPicker').hidden=true;field.focus();}
function forumLiveMentionSuggest(){const field=$('#mtLiveInput'),popup=$('#mtLiveMentionPopup');if(!field||!popup)return;
 const before=field.value.slice(0,field.selectionStart);const found=before.match(/(?:^|\s)@([A-Za-z0-9_-]{0,24})$/);if(!found){popup.hidden=true;return}
 const query=found[1].toLowerCase();const names=[...new Set(forumLiveMsgs.map(x=>x.author).filter(Boolean))].filter(n=>n.toLowerCase().includes(query)&&(!state.me||n.toLowerCase()!==state.me.name.toLowerCase())).slice(0,8);
 popup.hidden=names.length===0;popup.innerHTML=names.map(name=>`<button type="button" data-mention="${esc(name)}">@${esc(name)}</button>`).join('');
 popup.querySelectorAll('[data-mention]').forEach(b=>b.addEventListener('click',()=>{
 const val=field.value;const prior=val.slice(0,field.selectionStart),after=val.slice(field.selectionStart);const match=prior.match(/(?:^|\s)@[A-Za-z0-9_-]{0,24}$/);if(!match)return;
 const initial=prior.length-match[0].length;field.value=val.slice(0,initial)+(match[0].startsWith(' ')?' ':'')+'@'+b.dataset.mention+' '+after;popup.hidden=true;field.focus();
 }));
}
function forumLiveConnect(){
 if(!$('#mtLive')||state.view!=='forum')return;
 forumLiveManualClose=false;
 clearTimeout(forumLiveReconnect);
 if(forumLiveSocket&&(forumLiveSocket.readyState===WebSocket.OPEN||forumLiveSocket.readyState===WebSocket.CONNECTING))return;
 if(!window.WebSocket){forumLiveSetStatus('WebSockets are unavailable in this browser.');return;}
 const dot=$('#mtLiveDot');if(dot)dot.classList.remove('ready');
 const label=$('#mtLiveOnline');if(label)label.textContent='Connecting…';
 try{
 const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/forum/live/ws`);
 forumLiveSocket=ws;
 ws.onopen=()=>{forumLiveReconnectMs=700;dot?.classList.add('ready');forumLiveSetStatus('Connected');};
 ws.onmessage=event=>{
   if(forumLiveSocket!==ws||!$('#mtLive'))return;
   let packet;try{packet=JSON.parse(event.data)}catch{return}
   if(packet.type==='snapshot'){
      forumLiveHour=packet.hour;forumLiveNextReset=packet.nextReset;forumLiveMsgs=Array.isArray(packet.messages)?packet.messages:[];
      forumLiveOnline=packet.online||0;forumLivePaint(true);forumLiveClock();
   }else if(packet.type==='message'){
      if(!forumLiveMsgs.some(m=>m.id===packet.message?.id))forumLiveMsgs.push(packet.message);
      forumLivePaint();forumLiveSetStatus('Connected');
   }else if(packet.type==='delete'){
      forumLiveMsgs=forumLiveMsgs.filter(m=>m.id!==packet.id);forumLivePaint();
   }else if(packet.type==='reset'){
      forumLiveHour=packet.hour;forumLiveNextReset=packet.nextReset;forumLiveMsgs=[];forumLiveClearReply();forumLivePaint(true);
      forumLiveRemoveImage();forumLiveSetStatus('New chat hour');
   }else if(packet.type==='reactions'){const message=forumLiveMsgs.find(m=>m.id===packet.id);if(message){message.reactions=packet.reactions||[];forumLivePaint();}}else if(packet.type==='mention'){if(state.me&&String(packet.message?.author).toLowerCase()!==String(state.me.name).toLowerCase()){toast('@'+packet.message.author+' mentioned you in live chat','success');refreshUnread();}}else if(packet.type==='presence'){forumLiveOnline=packet.online||0;}
   else if(packet.type==='error'){forumLiveSetStatus(packet.error||'Message failed');toast(packet.error||'Chat error','error')}
   const online=$('#mtLiveOnline');if(online)online.textContent=`${forumLiveOnline} online`;
 };
 ws.onclose=()=>{
   if(forumLiveSocket!==ws)return;
   forumLiveSocket=null;dot?.classList.remove('ready');forumLiveSetStatus('Reconnecting…');
   if(!forumLiveManualClose&&state.view==='forum'&&$('#mtLive')){
      forumLiveReconnect=setTimeout(forumLiveConnect,forumLiveReconnectMs);
      forumLiveReconnectMs=Math.min(15000,forumLiveReconnectMs*1.7);
   }
 };
 ws.onerror=()=>{forumLiveSetStatus('Chat connection interrupted');};
 }catch(e){forumLiveSetStatus('Could not connect to live chat');}
 if(!forumLiveTimer)forumLiveTimer=setInterval(()=>{if(!$('#mtLive')||state.view!=='forum'){forumLiveStop();return}forumLiveClock()},1000);
}
function forumLiveKeyDown(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();forumLiveSend()}}
function forumLiveRemoveImage(){forumLiveUpload=null;const input=$('#mtLiveFile');if(input)input.value='';const preview=$('#mtLivePreview');if(preview)preview.hidden=true;const img=$('#mtLivePreviewImg');if(img){if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url='';img.removeAttribute('src')}}
async function forumLiveChooseImage(input){
 let file=input.files?.[0];forumLiveRemoveImage();if(!file)return;
 const types=['image/jpeg','image/png','image/webp','image/gif'];
 if(!types.includes(file.type)){toast('Choose JPG, PNG, WebP, or GIF.','error');return}
 if(file.size>700*1024 && file.type!=='image/gif'){
   try{file=await forumLiveCompress(file)}catch{toast('Could not process image.','error');return}
 }
 if(file.size>700*1024){toast('Image is too large. Choose an image under 700 KB.','error');return}
 forumLiveUpload=file;const preview=$('#mtLivePreview'),img=$('#mtLivePreviewImg');
 if(!preview||!img)return;
 img.dataset.url=URL.createObjectURL(file);img.src=img.dataset.url;
 $('#mtLivePreviewLabel').textContent=`${file.name||'Image'} · ${Math.ceil(file.size/1024)} KB`;
 preview.hidden=false;
}
async function forumLiveCompress(file){
 const bitmap=await createImageBitmap(file);
 try{
  const max=1400,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  for(const quality of [.8,.64,.48,.32]){
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
    if(blob&&blob.size<=700*1024)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'});
  }
  throw new Error('Image too large');
 }finally{bitmap.close?.()}
}
async function forumLiveSend(){
 const field=$('#mtLiveInput'),button=$('#mtLiveSend');if(!field||!button)return;
 const text=field.value.trim(),file=forumLiveUpload;
 if(!text&&!file)return;
 const socket=forumLiveSocket;
 if(!socket||socket.readyState!==WebSocket.OPEN){forumLiveSetStatus('Waiting for chat connection…');return}
 button.disabled=true;forumLiveSetStatus(file?'Uploading image…':'Sending…');
 try{
   let imageId='';
   if(file){
     const response=await fetch('/api/forum/live/upload',{method:'POST',headers:{'Content-Type':file.type},body:file,credentials:'same-origin'});
     const result=await response.json();if(!response.ok)throw new Error(result.error||'Upload failed');
     imageId=result.imageId;
   }
   if(forumLiveSocket!==socket||socket.readyState!==WebSocket.OPEN)throw new Error('Chat disconnected. Please try again.');
   socket.send(JSON.stringify({type:'send',body:text,imageId,replyTo:forumLiveReplyTo}));
   field.value='';forumLiveClearReply();forumLiveRemoveImage();forumLiveSetStatus('Sent');
 }catch(e){forumLiveSetStatus(e.message||'Could not send');toast(e.message||'Could not send','error')}
 finally{button.disabled=false;field.focus()}
}
function forumLiveDelete(id){const socket=forumLiveSocket;if(socket?.readyState!==WebSocket.OPEN){forumLiveSetStatus('Disconnected');return}socket.send(JSON.stringify({type:'delete',id}))}

}
function setForumMode(mode){state.forumMode=mode==='messages'?'messages':'forum';if(state.forumMode==='forum')state.activeDm=null;render()}
async function openDmThread(id){state.activeDm=Number(id)||null;state.forumMode='messages';render()}

async function dmPage(){
 if(!state.me)return `<div class="eyebrow">Private messages</div><h1 class="page-title">Messages</h1><section class="card">Sign in to message MediaTok members.</section>`;
 let threads=[];try{const d=await api('/api/dms');threads=d.threads||[];state.dmThreads=threads}catch(e){return `<div class="eyebrow">Community hub</div><h1 class="page-title">Private messages</h1><div class="tabs mt-forum-mode"><button class="tab" onclick="setForumMode('forum')">${ico('forum')} Forum</button><button class="tab active">${ico('chat')} Messages</button></div><section class="card"><b>Private messages need the latest database migration.</b><p class="sub">${esc(e.message||'Apply migration 0014_private_messages.sql and deploy again.')}</p></section>`}
 if(!state.activeDm&&threads[0])state.activeDm=Number(threads[0].id);
 let messages=[];if(state.activeDm){try{const d=await api('/api/dms/'+state.activeDm+'/messages');messages=d.messages||[]}catch{state.activeDm=null}}
 const active=threads.find(t=>Number(t.id)===Number(state.activeDm));
 const inbox=threads.length?threads.map(t=>`<button class="mt-dm-person ${Number(t.id)===Number(state.activeDm)?'active':''}" onclick="openDmThread(${Number(t.id)})">${avatar({name:t.other_name,avc:t.other_avatar||t.other_avatar_fallback},38)}<span><b>${esc(t.other_name)}</b><small>${esc((t.last_body||'Start a conversation').slice(0,70))}</small></span>${Number(t.unread)>0?`<i>${Number(t.unread)}</i>`:''}</button>`).join(''):`<div class="pf-none">No private conversations yet. Open a member profile and choose Message.</div>`;
 const conversation=active?`<section class="mt-dm-chat"><header><div>${avatar({name:active.other_name,avc:active.other_avatar||active.other_avatar_fallback},38)}<div><b>${esc(active.other_name)}</b><small>Private conversation</small></div></div><button class="btn white small" onclick="render()">${ico('refresh')} Refresh</button></header><div class="mt-dm-messages">${messages.length?messages.map(m=>`<div class="mt-dm-message ${Number(m.sender_id)===Number(state.me.id)?'mine':''}">${avatar({name:m.name,avc:m.avatar||m.avatar_fallback},28)}<div><b>${esc(m.name)}</b><p>${esc(m.body)}</p><small>${timeAgo(m.created_at)}</small></div></div>`).join(''):`<div class="pf-none">Say hello.</div>`}</div><form class="mt-dm-compose" onsubmit="sendDm(event,${Number(active.id)})"><input class="field" name="body" maxlength="2000" placeholder="Message ${esc(active.other_name)}…" autocomplete="off"><button class="btn primary">Send</button></form></section>`:`<section class="card mt-dm-empty"><div class="empty"><div class="emoji">${ico('chat')}</div><b>Select a conversation</b><p>Or open a member profile and tap Message.</p></div></section>`;
 return `<div class="eyebrow">Community hub</div><div class="mt-forum-title"><div><h1 class="page-title">Private messages</h1><p class="page-desc">Talk privately with other MediaTok members.</p></div><div class="tabs mt-forum-mode"><button class="tab" onclick="setForumMode('forum')">${ico('forum')} Forum</button><button class="tab active">${ico('chat')} Messages</button></div></div><div class="mt-dm-layout"><aside class="card mt-dm-inbox"><h3>Messages</h3>${inbox}</aside>${conversation}</div>`;
}
async function forumPage(){if(state.forumMode==='messages')return await dmPage();let threads=[],forumError='';try{threads=await api('/api/forum/threads')}catch(e){forumError=e.message||'Forum database tables are missing. Apply the forum migration, then refresh.'}const cats=['All','Anime','Manga','Novels','Movies & TV','Games','General'];return `<div class="eyebrow">Community hub</div><h1 class="page-title">MediaTok Forum</h1><p class="page-desc">Start discussions, share recommendations, debate endings, and talk about the media you love.</p>${state.me?`<div class="tabs mt-forum-mode"><button class="tab active">${ico('forum')} Forum</button><button class="tab" onclick="setForumMode('messages')">${ico('chat')} Private messages</button></div>`:''}${liveForumChatMarkup()}<section class="card"><div class="search-row"><input id="forumSearch" class="field" placeholder="Search discussions…" oninput="filterForum()"><button class="btn white" onclick="render()">${ico('refresh')} Refresh</button></div><div class="tabs" id="forumCats">${cats.map((c,i)=>`<button class="tab ${i===0?'active':''}" data-cat="${esc(c)}" onclick="forumCategory('${esc(c)}',this)">${esc(c)}</button>`).join('')}</div></section>${state.me?`<section class="card"><h3>Start a discussion</h3><input id="threadTitle" class="field" maxlength="140" placeholder="A clear, interesting title" style="margin-bottom:9px"><select id="threadCategory" class="select" style="margin-bottom:9px">${cats.slice(1).map(c=>`<option>${esc(c)}</option>`).join('')}</select><textarea id="threadBody" class="textarea" maxlength="5000" placeholder="Add context, your opinion, or a question…"></textarea><div class="sub" style="margin-top:7px">Be respectful. Spoiler warnings are appreciated.</div><button class="btn primary" style="margin-top:10px" onclick="createThread()">${ico('plus')} Post thread</button></section>`:`<section class="card">Sign in with Discord to start a discussion or reply.</section>`}<section class="card">${forumError?`<div class="tip"><b>Forum needs a database migration</b>${esc(forumError)}<br>The forum tables are missing or the Worker returned a database error. Apply migrations/0005_forum_repair.sql to the existing remote D1 database, deploy the Worker, then refresh.</div>`:''}<div class="section-head" style="margin-top:0"><h2>Discussions</h2><span class="sub">${threads.length} recent threads</span></div><div id="forumThreads">${threads.length?threads.map(t=>forumThread(t)).join(''):`<div class="empty"><div class="emoji">${ico('forum')}</div><b>No discussions yet</b><p>Be the first to start a conversation.</p></div>`}</div></section>`}
function forumThread(t){return `<article class="activity forum-thread" data-title="${esc((t.title+' '+t.body).toLowerCase())}" data-category="${esc(t.category)}" id="thread-${t.id}"><div class="activity-top">${avatar({name:t.author,avc:t.author_avatar},34)}<div><b>${esc(t.author)}</b><div class="sub">${timeAgo(t.created_at)} · ${Number(t.reply_count||0)} replies</div></div><span class="pill">${esc(t.category)}</span></div><h3 class="activity-title">${esc(t.title)}</h3><p style="white-space:pre-wrap;line-height:1.6">${esc(t.body)}</p><div class="activity-actions"><button class="textbtn" onclick="toggleThreadReplies(${t.id})">${ico('chat')} View replies (${Number(t.reply_count||0)})</button></div><div id="thread-replies-${t.id}" class="comments hidden"></div></article>`}

<style id="mediatok-v33-design-system">
/* One restrained visual language: typography, radii, spacing, surfaces and columns. */
:root{--accent:#4966a2;--ink:#202a39;--muted:#647388;--line:#dfe4eb;--surface:#fff;--bg:#f5f7fa;--soft:#edf2f8;--shadow:0 2px 16px rgba(18,33,55,.045);--ui-radius:12px;--ui-gap:16px;}

body,button,input,textarea,select{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif!important;font-size:14px;letter-spacing:0;}
body{line-height:1.52;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;}

:is(h1,h2,h3,h4){font-weight:600!important} .page-title{font-size:clamp(25px,2.5vw,34px)!important;font-weight:600!important;margin-bottom:8px!important}.page-desc{max-width:68ch;line-height:1.6!important}
:is(.eyebrow,.side-title){font-size:11px;letter-spacing:.06em!important;font-weight:600!important}
.top{display:flex;align-items:center;gap:16px;min-height:68px;height:auto;padding:10px clamp(16px,2vw,30px);border-bottom:1px solid var(--line);background:var(--surface);}
.topnav{display:flex;align-items:center;gap:2px;flex:0 1 auto;min-width:0;margin:0;}

.brand{font-size:20px;font-weight:600!important;flex:0 0 auto;}

.global-search .ic{width:17px;height:17px;flex:none}.global-search input{border:0!important;outline:none!important;background:transparent!important;min-width:0;width:100%;color:var(--ink)!important;padding:7px 0;font-weight:400!important;box-shadow:none!important;}
.global-search input::placeholder{color:var(--muted)!important}.global-search button{border:0;border-radius:7px;padding:7px 10px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;}
.topright{margin-left:0;flex:0 0 auto;gap:10px;}
.layout{max-width:1480px;grid-template-columns:210px minmax(0,1fr) 270px;gap:var(--ui-gap);padding-inline:20px;margin-top:20px;align-items:start;}
.layout>*{min-width:0}.main{min-width:0}.side,.rightcol{min-width:0;}
:is(.card,.panel,.media-tile,.result,.integration-card,.settings-card,.pf-sec,.pf-pass,.pf-hero,.mt-lb-hero,.welcome){border-radius:var(--ui-radius)!important;box-shadow:var(--shadow)!important;}
:is(.card,.panel,.media-tile,.result,.integration-card,.settings-card,.pf-sec,.pf-pass){border:1px solid var(--line);background:var(--surface);}
:is(.card,.panel,.settings-card,.pf-sec){padding:18px;}
:is(.btn,.field,.select,.textarea,.tab,.navbtn,.pill,.side-link){border-radius:9px!important;}
.btn{min-height:38px!important;padding:8px 13px!important;font-weight:600!important;transition:background .16s,border-color .16s!important;}
.btn:hover{transform:none!important;filter:brightness(.98)}.btn.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
:is(.media-grid,.stats,.settings-grid,.integration-grid,.search-results){gap:var(--ui-gap)!important;min-width:0;}
